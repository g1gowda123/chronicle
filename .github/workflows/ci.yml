name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System libraries for OpenCV and event clips
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 ffmpeg
      - name: Install core + dev + UI tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ui]"
      - name: Unit and integration tests
        run: python -m pytest
      - name: Model-free smoke test
        run: |
          chronicle demo --json > demo.json
          chronicle doctor --json > doctor.json
          chronicle ask "where is my cup?" --llm template > answer.json
          python -c "import json, pathlib; demo=json.loads(pathlib.Path('demo.json').read_text()); answer=json.loads(pathlib.Path('answer.json').read_text()); assert demo['restored_answer']; assert answer['entity']=='cup'; assert 'kitchen counter' in answer['answer']; print('model-free smoke test passed')"

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/chronicle-wheel
          /tmp/chronicle-wheel/bin/pip install dist/*.whl
          /tmp/chronicle-wheel/bin/chronicle demo --json > /tmp/wheel-demo.json
          /tmp/chronicle-wheel/bin/python -c "import json, pathlib; demo=json.loads(pathlib.Path('/tmp/wheel-demo.json').read_text()); assert demo['restored_answer']; print('wheel demo passed')"
