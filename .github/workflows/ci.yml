name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff
        run: ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System libraries for OpenCV and event clips
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 ffmpeg
      - name: Install core + dev + UI tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ui]"
      - name: Unit and integration tests
        run: python -m pytest
      - name: Model-free smoke test
        run: |
          chronicle demo --json > demo.json
          chronicle doctor --json > doctor.json
          chronicle ask "where is my cup?" --llm template > answer.json
          chronicle ask "where are my keys?" --llm template > unknown.json
          python -c "import json, pathlib; demo=json.loads(pathlib.Path('demo.json').read_text()); answer=json.loads(pathlib.Path('answer.json').read_text()); unknown=json.loads(pathlib.Path('unknown.json').read_text()); assert demo['restored_answer']; assert answer['entity']=='cup'; assert 'kitchen counter' in answer['answer']; assert unknown['entity'] is None; assert unknown['answer'] == \"I don't have that in my memory.\"; print('model-free smoke test passed')"

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Verify wheel package data
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "chronicle/demo_data/demo.db",
              "chronicle/storage/schema.sql",
              "chronicle/vfm/schema_v2.sql",
              "chronicle/vfm/schema_v3.sql",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"wheel is missing: {sorted(missing)}")
          print(f"{wheel.name}: {len(names)} files, package data present")
          PY
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/chronicle-wheel
          /tmp/chronicle-wheel/bin/pip install --upgrade pip
          /tmp/chronicle-wheel/bin/pip install dist/*.whl
          /tmp/chronicle-wheel/bin/chronicle demo --json > /tmp/wheel-demo.json
          /tmp/chronicle-wheel/bin/chronicle ask "where is my cup?" --llm template > /tmp/wheel-ask.json
          /tmp/chronicle-wheel/bin/chronicle doctor --json > /tmp/wheel-doctor.json
          /tmp/chronicle-wheel/bin/python -c "import json, pathlib; demo=json.loads(pathlib.Path('/tmp/wheel-demo.json').read_text()); ask=json.loads(pathlib.Path('/tmp/wheel-ask.json').read_text()); doctor=json.loads(pathlib.Path('/tmp/wheel-doctor.json').read_text()); assert demo['restored_answer']; assert ask['entity']=='cup'; assert 'kitchen counter' in ask['answer']; assert doctor['demo_memory']['query_ok']; print('wheel install passed')"
      - name: Install sdist in a clean environment
        run: |
          python -m venv /tmp/chronicle-sdist
          /tmp/chronicle-sdist/bin/pip install --upgrade pip
          /tmp/chronicle-sdist/bin/pip install dist/*.tar.gz
          /tmp/chronicle-sdist/bin/chronicle demo --json > /tmp/sdist-demo.json
          /tmp/chronicle-sdist/bin/chronicle doctor --json > /tmp/sdist-doctor.json
          /tmp/chronicle-sdist/bin/python -c "import json, pathlib; demo=json.loads(pathlib.Path('/tmp/sdist-demo.json').read_text()); doctor=json.loads(pathlib.Path('/tmp/sdist-doctor.json').read_text()); assert demo['restored_answer']; assert doctor['demo_memory']['query_ok']; print('sdist install passed')"
