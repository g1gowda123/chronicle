name: Bug report
description: Something is broken or gives an incorrect answer
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not include API keys, private video, or
        personal data. For security issues, use the private advisory link in
        `SECURITY.md`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the observed behaviour and why it is wrong.
      placeholder: The answer named the wrong object / the CLI crashed / ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Exact command, config, and the smallest relevant input.
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `chronicle doctor --json` is ideal.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or traceback
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
