# Chronicle evaluation configuration.
#
# All paths are resolved relative to the repository root (the directory that
# contains eval_pipeline.py), so a checkout can be moved without edits.
#
# Model loading is intentionally opt-in:
#   * detector.backend: auto | yolo-world | color
#   * hands.backend:    auto | mediapipe | hybrid | color | off
#   * embedder.backend: auto | openclip | color
#   * semantic.captioner_backend: auto | florence | stub
#
# Use the "offline" profile (eval_pipeline.py --offline) to reproduce the
# harness without downloading weights or starting Ollama.

project:
  name: chronicle-eval

paths:
  data_dir: data
  model_dir: models
  out_dir: runs/eval
  db_path: runs/eval/chronicle.db
  vocabulary_file: null

video:
  path: data/real/holoassist_z210_257s.mp4
  fps_override: null
  max_frames: null

qa:
  path: data/qa/holoassist_z210_40q.json
  format: ego4d

perception:
  detector_backend: auto
  # The large YOLO-World scale is the primary detector: it grounds flat objects
  # (cutting board) and appliances that the small model misses.  A two-scale
  # ``detector_models`` ensemble was also evaluated (see paper/RESULTS.md); it
  # raised Cook recall but destabilised HoloAssist instance counting, so it is
  # not the default.  Leave ``detector_models`` empty to run one model.
  detector_model: yolov8l-worldv2.pt
  detector_models: []
  detector_confidence: 0.30
  detector_imgsz: 640
  hands_backend: auto
  hands_model: hand_landmarker.task
  embedder_backend: auto
  embedder_model: ViT-B-32
  embedder_pretrained: laion2b_s34b_b79k
  device: auto
  frame_stride: 3
  motion_enabled: true
  clip_enabled: true
  # Empty list keeps the selected preset.  The evaluation uses the fixed scene
  # vocabulary declared in the QA metadata: broad prompts dilute YOLO-World
  # (111 classes) and ground fewer target objects than a 12-15 class scene list.
  # "none" is an evaluation setting; for a new video without scene metadata,
  # use "default" or list the classes under ``vocabulary`` below.
  vocabulary_preset: none    # default | broad | none
  vocabulary: []
  # Fixed prompt ensembles for open-vocabulary detection.  YOLO-World often
  # responds to a synonym more strongly than to the evaluation label; these
  # prompts are renamed back to the canonical term before tracking.  The set is
  # fixed a priori (common household synonyms), not derived from questions.
  prompt_aliases:
    nintendo switch: [switch console, switch]
    joy-con: [controller, joy con, joycon]
    comfort grip: [grip, handheld]
    joy-con strap: [wrist strap, strap]
    game card: [game cartridge, cartridge]
    sd card: [memory card, micro sd card]
    kickstand: [stand]
    power button: [power]
  # Research integrity: deriving detector prompts from the questions leaks the
  # evaluation set into perception.  Off by default; enable only for the
  # explicit leakage ablation.
  derive_vocabulary_from_qa: false

semantic:
  enabled: true
  # VLM budget: caption every Nth event trigger.  The budget sweep in
  # paper/RESULTS.md is flat from zero to every-trigger on the grounded QA
  # suite, so stride 4 keeps captions for salient events at ~1/4 the calls.
  # Set to 1 to caption every trigger, or 0 to disable captions entirely.
  caption_stride: 4
  # Fail fast instead of silently using StubCaptioner. The local path is
  # prepared by scripts/fetch_models.py and is resolved from the repo root.
  require_florence: true
  captioner_backend: auto      # auto | florence | qwen | stub
  embedder_backend: auto
  device: auto
  florence_model_id: models/Florence-2-base
  florence_max_new_tokens: 128
  florence_num_beams: 3
  # Alternative local VLM: Ollama qwen2.5vl:3b. Select with --captioner qwen.
  # No download is performed at run time; the model must already be pulled.
  qwen_vl_model: qwen2.5vl:3b
  qwen_vl_host: http://127.0.0.1:11434
  qwen_vl_timeout_s: 120.0
  qwen_vl_max_side: 448
  action_task: "<MORE_DETAILED_CAPTION>"
  action_min_confidence: 0.45
  llm_backend: template       # template | none | ollama | transformers | auto
  llm_model: qwen2.5:7b-instruct
  # Keep clip verification deterministic; the local LLM is used for QA only.
  action_llm_enabled: false
  ollama_url: http://127.0.0.1:11434
  require_citations: true
  lenient_citations: true
  max_facts: 40

baseline:
  sample_fps: 1.0
  captioner_backend: florence   # florence | stub (stub is only for harness tests)
  llm_backend: template         # template | ollama | none
  max_captions: null

evaluation:
  answer_matcher: token         # deterministic token/number matcher
  query_tolerance_s: 0.5

runtime:
  zone_label: null
  zone_id: null
  reset_db: true
  # "none" is the safe default for offline reporting; "baseline" uses the
  # bundled YOLO/MediaPipe/Florence stack from the config above.
  profile: baseline

metrics:
  # Per-frame latency percentiles reported in metrics.json.
  percentiles: [50, 95, 99]
  # The first frames include lazy model loading; report both all-frame and
  # steady-state latency so short smoke clips do not mislead.
  warmup_frames: 1
  # Read torch.cuda.max_memory_allocated() when CUDA is available.
  track_vram: true
