[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle"
version = "0.1.0"
description = "Egocentric episodic memory: motion-gated perception, nine-state lifecycle, dual temporal graphs, and semantic verification."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.10",
    "scipy>=1.11",
    "shapely>=2.0",
    "networkx>=3.1",
    "pillow>=10.0",
]

[project.optional-dependencies]
# YOLO-World, MediaPipe and OpenCLIP. The pipeline still runs without these
# using the palette/skin/HSV fallbacks (useful for the synthetic demo).
perception = [
    "ultralytics>=8.3",
    "mediapipe>=0.10.14",
    "open-clip-torch>=2.26",
    "torch>=2.2",
    "torchvision>=0.17",
    "pillow>=10.0",
]
# NiceGUI dashboard (`chronicle serve`).
ui = [
  "nicegui>=3.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
# Florence-2 captioning and the GraphRAG local-LLM path.
semantic-models = [
  "open-clip-torch>=2.26",
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.44",
  "accelerate>=0.30",
  "timm>=0.9",
  "einops>=0.7",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
chronicle = "chronicle.cli:main"
chronicle-perception = "chronicle.perception.cli:main"
chronicle-semantic-demo = "chronicle.semantic.demo:main"
chronicle-semantic-calibrate = "chronicle.semantic.calibration:main"
chronicle-semantic-eval = "chronicle.semantic.evaluation:main"

[tool.setuptools.packages.find]
include = ["chronicle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# `str, Enum` is kept intentionally so values serialize as plain strings on
# every supported Python version.
ignore = ["E501", "B008", "UP042"]
