[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle"
version = "0.1.0"
description = "Egocentric episodic memory: motion-gated perception, nine-state lifecycle, and dual temporal graphs."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.10",
    "scipy>=1.11",
    "shapely>=2.0",
    "networkx>=3.1",
]

[project.optional-dependencies]
# YOLO-World, MediaPipe and OpenCLIP. The pipeline still runs without these
# using the palette/skin/HSV fallbacks (useful for the synthetic demo).
perception = [
    "ultralytics>=8.3",
    "mediapipe>=0.10.14",
    "open-clip-torch>=2.26",
    "torch>=2.2",
    "torchvision>=0.17",
    "pillow>=10.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
chronicle-perception = "chronicle.perception.cli:main"

[tool.setuptools.packages.find]
include = ["chronicle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# `str, Enum` is kept intentionally so values serialize as plain strings on
# every supported Python version.
ignore = ["E501", "B008", "UP042"]
