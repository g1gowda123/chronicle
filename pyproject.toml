[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle-memory"
version = "0.1.0"
description = "Grounded, auditable episodic memory for egocentric video: event-gated perception, a nine-state lifecycle, dual temporal graphs, and optional semantic verification."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chronicle contributors" }]
keywords = [
    "egocentric video",
    "episodic memory",
    "video question answering",
    "scene graph",
    "GraphRAG",
    "vision-language",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.10",
    "scipy>=1.11",
    "shapely>=2.0",
    "networkx>=3.1",
    "pillow>=10.0",
]

[project.optional-dependencies]
# YOLO-World, MediaPipe and OpenCLIP. The pipeline still runs without these
# using the palette/skin/HSV fallbacks (useful for the synthetic demo).
perception = [
    "ultralytics>=8.3",
    "mediapipe>=0.10.14",
    "open-clip-torch>=2.26",
    "torch>=2.2",
    "torchvision>=0.17",
    "pillow>=10.0",
]
# NiceGUI dashboard (`chronicle serve`).
ui = [
  "nicegui>=3.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
# Florence-2 captioning and the GraphRAG local-LLM path.
semantic-models = [
  "open-clip-torch>=2.26",
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.44",
  "accelerate>=0.30",
  "timm>=0.9",
  "einops>=0.7",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "httpx>=0.27",
]

[project.scripts]
chronicle = "chronicle.cli:main"
chronicle-perception = "chronicle.perception.cli:main"
chronicle-semantic-demo = "chronicle.semantic.demo:main"
chronicle-semantic-calibrate = "chronicle.semantic.calibration:main"
chronicle-semantic-timeline = "chronicle.semantic.timeline:main"
chronicle-semantic-eval = "chronicle.semantic.evaluation:main"

[project.urls]
Homepage = "https://github.com/g1gowda123/chronicle"
Repository = "https://github.com/g1gowda123/chronicle"
Issues = "https://github.com/g1gowda123/chronicle/issues"
Documentation = "https://github.com/g1gowda123/chronicle/tree/main/docs"
Changelog = "https://github.com/g1gowda123/chronicle/blob/main/CHANGELOG.md"
Research = "https://github.com/g1gowda123/chronicle/blob/main/docs/RESEARCH_RESULTS.md"

[tool.setuptools.packages.find]
include = ["chronicle*"]

[tool.setuptools.package-data]
"chronicle.storage" = ["*.sql"]
"chronicle.vfm" = ["*.sql"]
"chronicle.demo_data" = ["*.db"]
"chronicle.evaluation_data" = ["*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# `str, Enum` is kept intentionally so values serialize as plain strings on
# every supported Python version.
ignore = ["E501", "B008", "UP042"]
